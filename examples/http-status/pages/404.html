/* Portable component baseline. Application layouts live in gallery.css. */
*{box-sizing:border-box}
html{font-size:16px;scroll-behavior:smooth}
body{margin:0;background:var(--tl-surface-page);color:var(--tl-text-primary);font-family:var(--tl-font-sans);font-size:var(--tl-type-body);line-height:var(--tl-leading-ui);font-synthesis:none}
button,input,select,textarea{font:inherit}
button,a,input,select,textarea,summary{-webkit-tap-highlight-color:transparent}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
[hidden]{display:none!important}
:focus-visible{outline:var(--tl-focus-width) solid var(--tl-focus-ring);outline-offset:var(--tl-focus-offset)}
h1,h2,h3,p{margin-top:0}
h1,h2,h3,strong,b{font-weight:600}
h1{font-size:var(--tl-type-title);line-height:1.15;letter-spacing:-.025em}
h2{font-size:var(--tl-type-section);line-height:1.3;letter-spacing:-.012em}
h3{font-size:var(--tl-type-subheading);line-height:1.4}
a{color:var(--tl-text-link);text-underline-offset:.18em}
a:hover{text-decoration-thickness:2px}
button svg,a svg{flex-shrink:0}
svg.icon{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
code,pre,kbd,.mono{font-family:var(--tl-font-mono);font-weight:400;font-variant-numeric:tabular-nums}
code{background:var(--tl-code-bg);color:var(--tl-code-text);font-size:.88em;padding:2px 5px;border-radius:2px;overflow-wrap:anywhere}
pre{background:var(--tl-code-bg);color:var(--tl-code-text);padding:20px;font-size:13px;line-height:1.8;overflow:auto;border-radius:var(--tl-radius-control)}
pre code{padding:0;font-size:inherit;white-space:pre;overflow-wrap:normal}
kbd{padding:2px 6px;border:1px solid var(--tl-control-border);border-radius:3px;font-size:12px}
hr{border:0;border-top:1px solid var(--tl-border-subtle);margin:32px 0}
.muted{color:var(--tl-text-secondary)}
.small{font-size:var(--tl-type-meta)}
.eyebrow{font-size:var(--tl-type-label);letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--tl-text-secondary)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:fixed;top:8px;left:8px;z-index:1000;background:var(--tl-surface-raised);padding:12px;transform:translateY(-150%)}
.skip:focus{transform:none}
.tl-button{display:inline-flex;gap:8px;align-items:center;justify-content:center;min-height:var(--tl-control-height);min-width:var(--tl-control-height);padding:var(--tl-control-py) var(--tl-control-px);border:1px solid var(--tl-control-border);border-radius:var(--tl-radius-control);background:var(--tl-surface-raised);color:var(--tl-text-primary);font-size:var(--tl-type-ui);font-weight:600;line-height:1.4;text-decoration:none;transition:background var(--tl-motion-fast)}
.tl-button:hover,.tl-button[data-demo-state="hover"]{background:var(--tl-surface-hover)}
.tl-button:active,.tl-button[data-demo-state="pressed"]{background:var(--tl-surface-selected)}
.tl-button.primary{background:var(--tl-action-primary-bg);color:var(--tl-action-primary-text);border-color:var(--tl-action-primary-bg)}
.tl-button.primary:hover,.tl-button.primary[data-demo-state="hover"]{background:var(--tl-action-primary-hover);border-color:var(--tl-action-primary-hover)}
.tl-button.primary:active,.tl-button.primary[data-demo-state="pressed"]{background:var(--tl-action-primary-pressed);border-color:var(--tl-action-primary-pressed)}
.tl-button.danger{background:var(--tl-action-danger-bg);color:var(--tl-action-danger-text);border-color:var(--tl-action-danger-bg)}
.tl-button.danger:hover{background:var(--tl-action-danger-hover);border-color:var(--tl-action-danger-hover)}
.tl-button.danger:active{background:var(--tl-action-danger-pressed);border-color:var(--tl-action-danger-pressed)}
.tl-button.quiet{border-color:transparent;background:transparent;color:var(--tl-text-link)}
.tl-button.quiet:hover{background:var(--tl-surface-hover)}
.tl-button:disabled,.tl-button[aria-disabled="true"],.tl-button:is(.primary,.danger,.quiet):is(:disabled,[aria-disabled="true"]){background:var(--tl-disabled-bg);border-color:var(--tl-disabled-bg);color:var(--tl-text-disabled)}
.tl-button[data-demo-state="focus"]{outline:2px solid var(--tl-focus-ring);outline-offset:3px}
.tl-button.icon-only{padding:8px}
.button-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tl-field{display:flex;flex-direction:column;gap:6px;min-width:0}
.tl-field>label,.tl-field>legend{font-size:var(--tl-type-ui);font-weight:600}
.tl-input,select,textarea{width:100%;min-width:0;min-height:var(--tl-control-height);border:1px solid var(--tl-control-border);border-radius:var(--tl-radius-control);background:var(--tl-surface-raised);color:var(--tl-text-primary);padding:var(--tl-control-py) 12px;font-size:var(--tl-type-ui);line-height:1.4}
.tl-input[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:var(--tl-status-danger-text);box-shadow:inset 3px 0 0 var(--tl-status-danger-text)}
input::placeholder,textarea::placeholder{color:var(--tl-text-secondary);opacity:1}
input:disabled{background:var(--tl-disabled-bg);color:var(--tl-text-disabled)}
input[type="checkbox"],input[type="radio"]{accent-color:var(--tl-text-link);width:18px;height:18px;flex-shrink:0}
.check-row{display:flex;align-items:center;gap:10px;min-height:44px;font-size:14px;cursor:pointer}
.tl-field .hint{font-size:13px;color:var(--tl-text-secondary);margin:0}
.tl-field .error{font-size:13px;color:var(--tl-status-danger-text);margin:0}
.tl-badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;line-height:1.4;padding:4px 8px;border-radius:3px;color:var(--tl-status-neutral-text);background:var(--tl-status-neutral-bg);white-space:nowrap}
.tl-badge svg{width:14px;height:14px}
.success{--status-text:var(--tl-status-success-text);--status-bg:var(--tl-status-success-bg)}
.warning{--status-text:var(--tl-status-warning-text);--status-bg:var(--tl-status-warning-bg)}
.error-state{--status-text:var(--tl-status-danger-text);--status-bg:var(--tl-status-danger-bg)}
.info{--status-text:var(--tl-status-info-text);--status-bg:var(--tl-status-info-bg)}
.tl-badge:is(.success,.warning,.error-state,.info){color:var(--status-text);background:var(--status-bg)}
.tl-callout{display:flex;align-items:flex-start;gap:12px;padding:16px 20px;border-left:3px solid var(--status-text);background:var(--status-bg);color:var(--status-text);font-size:14px}

<footer class="page-footer"><span class="footer-label">Teske’s Lab</span><span class="footer-code">404 / NOT FOUND</span></footer></div><script>(() => {
  const root = document.documentElement;
  const toggle = document.querySelector('.theme-toggle');
  const translations = {"home": "Voltar ao laboratório", "retry": "Tentar novamente", "skip": "Ir para a mensagem", "homeLabel": "Página inicial do Teske’s Lab", "slogan": "EXPLORAR / CRIAR / DESCOBRIR", "dark": "Usar tema escuro", "light": "Usar tema claro", "preview": "PRÉVIA DAS PÁGINAS", "previewLabel": "Controles da prévia", "pagesLabel": "Páginas de status HTTP", "download": "Baixar páginas", "module": "T/L — MÓDULO DE RESPOSTA", "statuses": {"404": {"name": "Não encontrado", "headline": "Este caminho<br><span>termina aqui.</span>", "description": "Não encontramos a página que você procura. O endereço pode ter mudado ou pode haver um erro de digitação.", "board": "CIRCUITO ABERTO"}, "403": {"name": "Acesso negado", "headline": "Esta área tem<br><span>acesso restrito.</span>", "description": "O acesso a esta página não é permitido. Se você deveria ter acesso, entre em contato com o responsável pelo site.", "board": "ACESSO RESTRITO"}, "429": {"name": "Muitas solicitações", "headline": "Vamos reduzir<br><span>o ritmo.</span>", "description": "Recebemos muitas solicitações em pouco tempo. Aguarde um momento antes de tentar novamente.", "board": "LIMITE DE REQUISIÇÕES"}, "500": {"name": "Erro interno do servidor", "headline": "Algo saiu<br><span>do roteiro.</span>", "description": "O servidor não conseguiu concluir esta solicitação. Tente novamente ou volte à página inicial.", "board": "FALHA INESPERADA"}, "502": {"name": "Falha no gateway", "headline": "Um elo<br><span>se rompeu.</span>", "description": "Um dos serviços que atendem esta página retornou uma resposta inesperada. Tente novamente em breve.", "board": "RESPOSTA INTERROMPIDA"}, "503": {"name": "Serviço indisponível", "headline": "Uma pausa<br><span>por enquanto.</span>", "description": "Este serviço está temporariamente indisponível. Tente novamente em alguns instantes ou volte à página inicial.", "board": "TEMPORARIAMENTE OFFLINE"}}};
  const languages = navigator.languages?.length ? navigator.languages : [navigator.language];
  const language = languages.map(value => value?.toLowerCase().split('-')[0])
    .find(value => value === 'pt' || value === 'en') || 'en';
  if (language === 'pt') {
    const code = document.querySelector('.status-number').textContent.match(/\d+/)[0];
    const status = translations.statuses[code];
    const text = (selector, value) => {
      const element = document.querySelector(selector);
      if (element) element.textContent = value;
    };
    root.lang = 'pt-BR';
    document.title = `${code} · ${status.name} — Teske’s Lab`;
    document.querySelector('meta[name="description"]').content = `${code} ${status.name} — Teske’s Lab.`;
    text('.skip', translations.skip);
    document.querySelector('.identity').setAttribute('aria-label', translations.homeLabel);
    text('.header-label', translations.slogan);
    text('.status-line span:last-child', status.name);
    // This HTML comes only from the bundled translation file, never from the request.
    document.querySelector('h1').innerHTML = status.headline;
    text('.description', status.description);
    document.querySelectorAll('.actions a').forEach(link => {
      const label = link.getAttribute('href') === '' ? translations.retry : translations.home;
      link.firstChild.textContent = label;
    });
    text('.footer-code', `${code} / ${status.name.toUpperCase()}`);
    text('.art-caption', status.board);
    text('.chip-label', status.board);
    text('.board-label text:first-child', translations.module);
    text('.preview-label', translations.preview);
    const tray = document.querySelector('.preview-bar');
    if (tray) {
      tray.setAttribute('aria-label', translations.previewLabel);
      document.querySelector('.page-picker').setAttribute('aria-label', translations.pagesLabel);
      document.querySelectorAll('.page-picker a').forEach(link => {
        link.setAttribute('aria-label', `${link.textContent} ${translations.statuses[link.textContent].name}`);
      });
      document.querySelector('.download').lastChild.textContent = translations.download;
    }
  }
  const setTheme = theme => {
    root.dataset.theme = theme;
    if (toggle) toggle.setAttribute('aria-label', language === 'pt'
      ? translations[theme === 'dark' ? 'light' : 'dark']
      : `Switch to ${theme === 'dark' ? 'light' : 'dark'} theme`);
  };
  let saved;
  try { saved = localStorage.getItem('teske-status-theme'); } catch (_) {}
  setTheme(saved === 'dark' || saved === 'light' ? saved : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  if (toggle) {
    toggle.hidden = false;
    toggle.addEventListener('click', () => {
      const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
      setTheme(next);
      try { localStorage.setItem('teske-status-theme', next); } catch (_) {}
    });
  }
})();
