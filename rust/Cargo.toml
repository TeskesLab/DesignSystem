[package]
name = "teskeslab-design-system"
version = "1.0.0"
edition = "2024"
rust-version = "1.92"
description = "Teske's Lab semantic design tokens, fonts, and optional egui and GPUI Kit adapters"
repository = "https://github.com/TeskesLab/DesignSystem"
documentation = "https://github.com/TeskesLab/DesignSystem/blob/main/docs/15-rust-library.md"
license = "Apache-2.0 AND OFL-1.1 AND CC-BY-SA-4.0"
readme = "README.md"
publish = ["crates-io"]
keywords = ["design-system", "theme", "egui", "gpui", "tokens"]
categories = ["gui", "no-std"]
include = [
    "Cargo.toml", "Cargo.lock", "README.md",
    "LICENSE", "LICENSE-CC-BY-SA-4.0.txt",
    "src/**", "fonts/**", "tests/**", "examples/**", "shell.nix",
]

[features]
default = []
egui = ["dep:egui"]
gpui-kit = ["dep:gpui-kit"]
egui-showcase = ["egui", "dep:eframe", "dep:image"]
gpui-test-support = ["gpui-kit", "gpui-kit/test-support"]
gpui-showcase = ["gpui-test-support"]

[dependencies]
egui = { version = "0.33", optional = true, default-features = false, features = ["default_fonts"] }
gpui-kit = { version = "=0.8.1", optional = true }
eframe = { version = "0.33", optional = true, default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }

[[example]]
name = "showcase"
required-features = ["egui-showcase"]

[[example]]
name = "gpui_showcase"
path = "examples/gpui_showcase.rs"
required-features = ["gpui-showcase"]
