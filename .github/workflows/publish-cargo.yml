name: Publish Cargo

on:
  push:
    tags: ['rust/v*']

permissions:
  contents: read

concurrency:
  group: cargo-release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: '1.99.0'
  CARGO_TERM_COLOR: always

jobs:
  check:
    if: github.repository == 'TeskesLab/DesignSystem' && !github.event.deleted
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag and source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, tomllib
          from pathlib import Path
          package = tomllib.loads(Path('rust/Cargo.toml').read_text())['package']
          expected = 'rust/v' + package['version']
          if os.environ['RELEASE_TAG'] != expected:
              raise SystemExit(f'Release tag must equal {expected}')
          PY
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
      - uses: cachix/install-nix-action@d9186cbdca7adedf113a159fa91f725a27866771 # v31
        with:
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/31ecbaca1bdefa45dffc409f0250bd8039ea0010.tar.gz
      - name: Check generated assets and feature combinations
        run: |
          nix-shell rust/shell.nix --run '
            set -eu
            python3 scripts/build_native.py --check
            cargo fmt --manifest-path rust/Cargo.toml -- --check
            cargo test --manifest-path rust/Cargo.toml --locked --no-default-features
            cargo test --manifest-path rust/Cargo.toml --locked --features egui
            cargo check --manifest-path rust/Cargo.toml --locked --features gpui-kit
            cargo check --manifest-path rust/Cargo.toml --locked --features egui,gpui-kit
            cargo test --manifest-path rust/Cargo.toml --locked --all-features
            cargo clippy --manifest-path rust/Cargo.toml --locked --all-features --all-targets -- -D warnings
            RUSTDOCFLAGS="-D warnings" cargo doc --manifest-path rust/Cargo.toml --locked --all-features --no-deps
            cargo publish --manifest-path rust/Cargo.toml --registry crates-io --locked --all-features --dry-run
          '

  publish:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: Verify default-feature package before authentication
        run: cargo publish --manifest-path rust/Cargo.toml --registry crates-io --locked --dry-run
      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish tagged crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --manifest-path rust/Cargo.toml --registry crates-io --locked
